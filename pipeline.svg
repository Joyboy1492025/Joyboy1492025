<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-label="Animated five-agent pipeline: Collector, Validator, Deduplicator, Analyst, Writer">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      text { font-family: 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
      .name { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .role { font-size: 11px; fill: #9e7eb3; }
      .flow { stroke-dasharray: 8 8; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      .node { animation: pop 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="920" height="210" rx="16" fill="#0d0720"/>

  <path id="track" d="M 90 105 L 830 105" stroke="url(#line)" stroke-width="3" fill="none" class="flow" opacity="0.9"/>

  <!-- glowing packet travelling through the pipeline -->
  <circle r="9" fill="#00f0ff" filter="url(#blur)">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="4" fill="#ffffff">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>

  <!-- nodes -->
  <g class="node" style="animation-delay:0s">
    <rect x="20" y="62" width="140" height="86" rx="12" fill="#0b1d2e" stroke="#00f0ff" stroke-width="2"/>
    <text x="90" y="98" text-anchor="middle" class="name">Collector</text>
    <text x="90" y="120" text-anchor="middle" class="role">discover</text>
  </g>
  <g class="node" style="animation-delay:0.4s">
    <rect x="204" y="62" width="140" height="86" rx="12" fill="#0b1d2e" stroke="#00ff73" stroke-width="2"/>
    <text x="274" y="98" text-anchor="middle" class="name">Validator</text>
    <text x="274" y="120" text-anchor="middle" class="role">verify</text>
  </g>
  <g class="node" style="animation-delay:0.8s">
    <rect x="388" y="62" width="140" height="86" rx="12" fill="#0b1d2e" stroke="#ffb800" stroke-width="2"/>
    <text x="458" y="98" text-anchor="middle" class="name">Deduplicator</text>
    <text x="458" y="120" text-anchor="middle" class="role">clean</text>
  </g>
  <g class="node" style="animation-delay:1.2s">
    <rect x="572" y="62" width="140" height="86" rx="12" fill="#0b1d2e" stroke="#7b2ff7" stroke-width="2"/>
    <text x="642" y="98" text-anchor="middle" class="name">Analyst</text>
    <text x="642" y="120" text-anchor="middle" class="role">synthesize</text>
  </g>
  <g class="node" style="animation-delay:1.6s">
    <rect x="756" y="62" width="140" height="86" rx="12" fill="#0b1d2e" stroke="#ff007f" stroke-width="2"/>
    <text x="826" y="98" text-anchor="middle" class="name">Writer</text>
    <text x="826" y="120" text-anchor="middle" class="role">report</text>
  </g>

  <text x="460" y="30" text-anchor="middle" style="font-size:12px;fill:#00f0ff;letter-spacing:2px">MULTI-AGENT RESEARCH PIPELINE</text>
  <text x="460" y="190" text-anchor="middle" style="font-size:11px;fill:#9e7eb3">grounded in retrieved sources · validated · deduplicated · cited</text>
</svg>
